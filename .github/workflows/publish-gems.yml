name: Publish Gems

on:
  workflow_dispatch:
    inputs:
      gem:
        description: Gem to publish
        required: true
        type: choice
        default: annes_auth
        options:
          - annes_auth
          - annes_admin
          - annes_access
          - annes_audit
          - anne_loyalty
      version:
        description: Expected gem version to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish / ${{ github.event.inputs.gem }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify dispatch ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish Gems must be dispatched from the main branch. Got: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9

      - name: Prepare release
        id: prepare
        shell: bash
        env:
          RELEASE_GEM: ${{ github.event.inputs.gem }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/${RELEASE_GEM}-${RELEASE_VERSION}-release-notes.md"

          ruby script/prepare_gem_release \
            --gem "$RELEASE_GEM" \
            --version "$RELEASE_VERSION" \
            --notes-file "$notes_file" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify remote tag is available
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.prepare.outputs.tag_name }}"
          if git ls-remote --tags origin "$tag_name" | grep -q .; then
            echo "Remote tag already exists: $tag_name"
            exit 1
          fi

      - name: Configure RubyGems credentials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ~/.gem
          cat > ~/.gem/credentials <<EOF
          ---
          :github: Bearer ${GITHUB_TOKEN}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Build gem
        id: build
        working-directory: ${{ steps.prepare.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.prepare.outputs.version }}"
          gem build "${{ steps.prepare.outputs.gemspec }}"

          gem_file="${{ steps.prepare.outputs.gem }}-${version}.gem"
          test -f "$gem_file"
          echo "gem_file=$gem_file" >> "$GITHUB_OUTPUT"

      - name: Verify gem license
        run: ruby script/check_gem_license "${{ steps.prepare.outputs.path }}/${{ steps.build.outputs.gem_file }}"

      - name: Push gem
        working-directory: ${{ steps.prepare.outputs.path }}
        run: gem push --key github --host https://rubygems.pkg.github.com/quartet-labo "${{ steps.build.outputs.gem_file }}"

      - name: Configure git author
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.prepare.outputs.tag_name }}"
          git tag "$tag_name" "$GITHUB_SHA"
          git push origin "$tag_name"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="${{ steps.prepare.outputs.tag_name }}"
          gh release create "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.prepare.outputs.gem }} ${{ steps.prepare.outputs.version }}" \
            --notes-file "${{ steps.prepare.outputs.notes_file }}" \
            --verify-tag
