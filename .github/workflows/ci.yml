name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9

      - name: Test documentation checker
        run: ruby test/documentation_checker_test.rb

      - name: Verify public project policies
        run: ruby test/public_project_policy_test.rb

      - name: Test package release contracts
        run: |
          ruby test/prepare_gem_release_test.rb
          ruby test/publish_gems_workflow_test.rb

      - name: Check documentation
        run: ruby script/check_docs

  license-compliance:
    name: License compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9

      - name: Verify MIT license packaging
        run: ruby test/mit_license_compliance_test.rb

  changes:
    name: Select tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_tests: ${{ steps.select.outputs.has_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9

      - name: Test CI target selector
        run: ruby test/ci_target_selector_test.rb

      - name: Select test targets
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="${base_sha}...${head_sha}"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="${base_sha}..${head_sha}"
              ;;
            *)
              ruby script/select_ci_targets \
                --all-reason "unsupported event: $EVENT_NAME" \
                --github-output "$GITHUB_OUTPUT" \
                --summary "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ ]]; then
            ruby script/select_ci_targets \
              --all-reason "comparison revisions are unavailable" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}" || ! git cat-file -e "${head_sha}^{commit}"; then
            ruby script/select_ci_targets \
              --all-reason "comparison revisions could not be fetched" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/changed-paths.txt"
          if ! git diff --name-only --no-renames "$diff_range" > "$changed_paths"; then
            ruby script/select_ci_targets \
              --all-reason "git diff failed" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ruby script/select_ci_targets \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "$changed_paths"

  test:
    name: Test / ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/${{ matrix.database }}
      RAILS_ENV: test
      INQUIRY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/annes_inquiry_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true
          working-directory: ${{ matrix.path }}

      - name: Prepare database
        if: startsWith(matrix.path, 'examples/')
        working-directory: ${{ matrix.path }}
        run: bin/rails db:test:prepare

      - name: Prepare inquiry database
        if: matrix.module == 'annes_inquiry'
        working-directory: annes_inquiry
        run: bin/test --prepare

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test_command }}

      - name: Run inquiry browser tests
        if: matrix.module == 'annes_inquiry'
        working-directory: annes_inquiry
        run: bin/test --system

      - name: Scan inquiry Engine
        if: matrix.module == 'annes_inquiry'
        working-directory: annes_inquiry
        run: bundle exec brakeman --force-scan --no-pager

      - name: Keep inquiry screenshots
        if: failure() && matrix.module == 'annes_inquiry'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-inquiry-tests
          path: annes_inquiry/test/dummy/tmp/screenshots
          if-no-files-found: ignore

      - name: Upload inquiry coverage
        if: matrix.module == 'annes_inquiry'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-inquiry-tests
          path: annes_inquiry/coverage
          include-hidden-files: true
          if-no-files-found: error

  test-result:
    name: Tests
    needs:
      - changes
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check test results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_TESTS: ${{ needs.changes.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Test selection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$HAS_TESTS" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "Selected tests did not succeed: $TEST_RESULT"
            exit 1
          fi

          if [[ "$HAS_TESTS" != "true" && "$TEST_RESULT" != "skipped" ]]; then
            echo "Expected the matrix job to be skipped, but it was: $TEST_RESULT"
            exit 1
          fi

          echo "Test selection and execution completed successfully."
